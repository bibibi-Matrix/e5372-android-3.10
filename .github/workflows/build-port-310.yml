name: build-port-310
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  probe-310:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libssl-dev bc cpio gcc make p7zip-full
      - name: Download cross toolchain (Sourcery 2010q1, gcc 4.5.1)
        run: |
          curl -sL -o tc.tar.bz2 \
            "https://downloads.sourceforge.net/project/iadfilehost/devtools/arm-2010q1-202-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2"
          tar xjf tc.tar.bz2 -C $HOME
          echo "$HOME/arm-2010q1/bin" >> $GITHUB_PATH
          arm-none-linux-gnueabi-gcc --version | head -1
      - name: Probe build vanilla 3.10.108 vexpress
        run: bash port/probe-310.sh
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-310-log
          path: probe-310.log
          if-no-files-found: warn

  build-balong:
    runs-on: ubuntu-22.04
    needs: probe-310
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libssl-dev bc cpio gcc make p7zip-full
      - name: Download cross toolchain (Sourcery 2010q1, gcc 4.5.1)
        run: |
          curl -sL -o tc.tar.bz2 \
            "https://downloads.sourceforge.net/project/iadfilehost/devtools/arm-2010q1-202-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2"
          tar xjf tc.tar.bz2 -C $HOME
          echo "$HOME/arm-2010q1/bin" >> $GITHUB_PATH
          arm-none-linux-gnueabi-gcc --version | head -1
      - name: Download GPL source from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download gpl-test --pattern "*.tar.gz" --clobber
          ls -la gpl.tar.gz 2>/dev/null || ls -la E5372_GPL_Code.tar.gz
          7z x *.tar.gz -y >/dev/null 2>&1 || true
          7z x *.tar -y >/dev/null 2>&1 || true
          test -d android-2.6.35 && echo "GPL extracted OK"
      - name: Apply balong layer and build
        run: bash port/build-balong-310.sh
      - name: Upload balong build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balong-310-log
          path: balong-310.log
          if-no-files-found: warn
      - name: Upload zImage if built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balong-310-zimage
          path: linux-3.10.108/arch/arm/boot/zImage
          if-no-files-found: warn
      - name: Upload vmlinux and System.map if built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balong-310-vmlinux
          path: |
            linux-3.10.108/vmlinux
            linux-3.10.108/System.map
          if-no-files-found: warn