name: build-stock-kernel
on:
  workflow_dispatch:

jobs:
  build-2635:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cross toolchain (gcc 10 arm-linux-gnueabi)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi gcc-10-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi bison flex libssl-dev bc cpio gcc make
          arm-linux-gnueabi-gcc --version | head -1
      - name: Download GPL source from Release
        run: |
          curl -sL -o gpl.tar.gz \
            "https://github.com/bibibi-Matrix/e5372-android-3.10/releases/download/gpl-test/E5372_GPL_Code.tar.gz"
          tar xzf gpl.tar.gz -C . 2>&1 | head -5
          ls -la
      - name: Patch for modern GCC builds (2.6.35-era kernel)
        run: |
          cd android-2.6.35
          # 2.6.35 kernel on gcc>=6: disable -Werror-like pitfalls. Common fixes:
          # 1) 'const dom_st' none; big one: CFLAGS -fno-delete-null-pointer-checks
          # See https://github.com/torvalds/linux/issues for backports. Minimal patch set:
          sed -i 's/^EXTRAVERSION = .7/EXTRAVERSION = .7-v8/' Makefile
      - name: Configure and build (try SDK defconfig)
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          export INCLUDE_FLAG="-I./include/linux"
          make hisi_balong_hi6920cs_e5776s_defconfig 2>&1 | tail -30
          echo "=== config diff vs stock ==="
          diff arch/arm/configs/hisi_balong_hi6920cs_e5776s_defconfig \
               "$GITHUB_WORKSPACE/docs/stock_kernel_config_2.6.35.7.txt" 2>&1 | head -60 || true
      - name: Build kernel
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          make -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -60
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-kernel-2.6.35
          path: |
            android-2.6.35/arch/arm/boot/zImage
            android-2.6.35/vmlinux
            android-2.6.35/.config
            build.log
          if-no-files-found: warn