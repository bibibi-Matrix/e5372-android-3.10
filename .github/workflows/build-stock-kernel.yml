name: build-stock-kernel
on:
  workflow_dispatch:

jobs:
  build-2635:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libssl-dev bc cpio gcc make p7zip-full
      - name: Download cross toolchain (gcc 4.4.1 arm-none-linux-gnueabi)
        run: |
          curl -sL -o tc.tar.bz2 \
            "https://github.com/RunningFruits/arm-none-linux-gnueabi-gcc-files/raw/master/arm-2009q1-203-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2"
          tar xjf tc.tar.bz2 -C $HOME
          TOOLCHAIN=$HOME/arm-2009q1/arm-none-linux-gnueabi
          $TOOLCHAIN/bin/arm-none-linux-gnueabi-gcc --version
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
      - name: Download GPL source from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: token $GH_TOKEN" -o gpl.tar.gz \
            "https://github.com/bibibi-Matrix/e5372-android-3.10/releases/download/gpl-test/E5372_GPL_Code.tar.gz"
          ls -la gpl.tar.gz
          file gpl.tar.gz || true
          7z x gpl.tar.gz -y >/dev/null 2>&1 || true
          7z x gpl.tar -y >/dev/null 2>&1 || true
          ls -d android-2.6.35 2>&1 || true
      - name: Patch EXTRAVERSION (harmless)
        run: |
          cd android-2.6.35
          sed -i 's/^EXTRAVERSION = .7/EXTRAVERSION = .7-v8/' Makefile
      - name: Configure and build (try SDK defconfig)
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-none-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          export INCLUDE_FLAG="-I./include/linux"
          make hisi_balong_hi6920cs_e5776s_defconfig 2>&1 | tail -30
          echo "=== config diff vs stock ==="
          diff arch/arm/configs/hisi_balong_hi6920cs_e5776s_defconfig \
               "$GITHUB_WORKSPACE/docs/stock_kernel_config_2.6.35.7.txt" 2>&1 | head -60 || true
      - name: Build kernel
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-none-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          make -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -60
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-kernel-2.6.35
          path: |
            android-2.6.35/arch/arm/boot/zImage
            android-2.6.35/vmlinux
            android-2.6.35/.config
            build.log
          if-no-files-found: warn