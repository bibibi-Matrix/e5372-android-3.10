name: build-stock-kernel
on:
  workflow_dispatch:

jobs:
  build-2635:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libssl-dev bc cpio gcc make p7zip-full
      - name: Download cross toolchain (Sourcery 2010q1, gcc 4.5.1)
        run: |
          curl -sL -o tc.tar.bz2 \
            "https://downloads.sourceforge.net/project/iadfilehost/devtools/arm-2010q1-202-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2"
          tar xjf tc.tar.bz2 -C $HOME
          TOOLCHAIN=$HOME/arm-2010q1
          $TOOLCHAIN/bin/arm-none-linux-gnueabi-gcc --version | head -1
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
      - name: Download GPL source from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download gpl-test --pattern "*.tar.gz" --clobber
          ls -la gpl.tar.gz 2>/dev/null || ls -la E5372_GPL_Code.tar.gz
          7z x *.tar.gz -y >/dev/null 2>&1 || true
          7z x *.tar -y >/dev/null 2>&1 || true
          test -d android-2.6.35 && echo "GPL extracted OK"
      - name: Patch EXTRAVERSION (harmless)
        run: |
          cd android-2.6.35
          sed -i 's/^EXTRAVERSION = .7/EXTRAVERSION = .7-v8/' Makefile
      - name: Configure and build (try SDK defconfig)
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-none-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          export INCLUDE_FLAG="-I./include/linux"
          make hisi_balong_hi6920cs_e5776s_defconfig 2>&1 | tail -30
      - name: Build kernel
        run: |
          cd android-2.6.35
          export ARCH=arm
          export CROSS_COMPILE=arm-none-linux-gnueabi-
          export FEATURE_WIFI=FEATURE_ON
          make -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -60
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-kernel-2.6.35
          path: |
            android-2.6.35/arch/arm/boot/zImage
            android-2.6.35/vmlinux
            android-2.6.35/.config
            build.log
          if-no-files-found: warn